<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de apresentação | Grupo Rafael Thomaz</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@page{size:landscape;margin:0}@page{size:1920px 1080px;margin:0}
*{box-sizing:border-box}html,body{margin:0}body{background:#DAD6CE;font-family:'Poppins',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
p,h1,h2,h3{margin:0}
.bar{position:sticky;top:0;z-index:5;background:#0A1B30;color:#F3F1ED;padding:14px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#9BB5DC;font-weight:500}
.bar input[type=text],.bar select,.bar textarea{font:14px 'Poppins',sans-serif;padding:8px 10px;border-radius:8px;border:1px solid #34506F;background:#132743;color:#F3F1ED;width:230px}
.bar textarea{height:64px;resize:vertical;width:300px}
.bar .ck{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:#F3F1ED;padding-bottom:10px;width:190px}
.bar button{font:600 14px 'Poppins',sans-serif;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#E8508C;color:#0A1B30}
.bar button.g{background:transparent;color:#F3F1ED;border:1px solid #34506F}
.deck{padding:24px;display:flex;flex-direction:column;align-items:center;gap:24px}
.frame{width:calc(1920px*var(--s));height:calc(1080px*var(--s));overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.18)}
.slide{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Poppins',sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px;transform:scale(var(--s));transform-origin:0 0}
.nv{background:#0A1B30;color:#F3F1ED}.cr{background:#F3F1ED;color:#0A1B30}.pk{background:#E8508C;color:#0A1B30}
.slide h2{font-size:56px;font-weight:700;line-height:1.1}
.grid{display:grid;gap:24px}
.card{border-radius:24px;padding:40px;display:flex;flex-direction:column;gap:10px}
.nv .card{background:#132743;border:1px solid #27405F}.cr .card{background:#FCFBF7;border:1px solid #E3DFD7}
.card .k{font-size:24px;font-weight:600;color:#C2306B}.nv .card .k{font-size:28px;font-weight:700;color:#E8508C}
.card h3{font-size:34px;font-weight:700;line-height:1.2}.card p{font-size:26px;line-height:1.4;color:#4A5568}.nv .card p{color:#B8C4D6}
.ft{position:absolute;left:128px;right:128px;bottom:48px;display:flex;justify-content:space-between;align-items:center;gap:48px}
.ft img{width:230px;height:48px;object-fit:contain;flex:none}.ft span{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{justify-content:space-between;padding:96px 128px 112px;gap:0}
.logos{display:flex;align-items:center;gap:48px}.logos i{width:2px;height:56px;background:#34506F}
.mid{display:flex;flex-direction:column;gap:32px}
.eb{font-size:26px;font-weight:500;color:#9BB5DC}
.cv h1{font-size:88px;font-weight:300;line-height:1.1}b{font-weight:700}.pt{color:#E8508C}
.sub{font-size:34px;line-height:1.4;color:#B8C4D6;width:1300px}
.chips{display:flex;flex-wrap:wrap;gap:20px}.chip{border:1px solid #4A6688;border-radius:40px;padding:14px 32px;font-size:28px;font-weight:500}
.lab{display:flex;flex-direction:column;gap:8px}.lab small{font-size:24px;color:#8FA0B8}.lab span{font-size:36px;font-weight:600}
.stat p:first-child{font-size:64px;font-weight:700;line-height:1.1}.stat p:last-child{font-size:24px;line-height:1.3;color:#B8C4D6}
@media print{@page{size:landscape;margin:0}@page{size:1920px 1080px;margin:0}*,*:before,*:after{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}html,body{margin:0 !important;padding:0 !important;background:none !important;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}html{--s:1 !important}.bar,.pn{display:none !important}.deck{padding:0 !important;margin:0 !important;gap:0 !important;display:block !important;width:1920px !important}.frame{width:1920px !important;height:1080px !important;overflow:hidden !important;box-shadow:none !important;break-after:page !important;page-break-after:always !important;display:block !important;margin:0 !important;padding:0 !important}.frame:last-child{break-after:auto !important;page-break-after:auto !important}.slide{transform:none !important;width:1920px !important;height:1080px !important;margin:0 !important;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}}
.pn{background:#F3F1ED;padding:10px 24px;font-size:14px}.pn summary{cursor:pointer;font-weight:600;color:#0A1B30}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.pg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#4A5568;font-weight:500}.pg .w{grid-column:span 3}
.pg input,.pg textarea{font:13px 'Poppins',sans-serif;padding:7px 9px;border-radius:8px;border:1px solid #C9C3B8;background:#fff;color:#0A1B30;width:100%}.pg textarea{height:52px;resize:vertical}
.pb{display:flex;gap:10px;align-items:center;margin-top:12px}.pb button{font:600 13px 'Poppins',sans-serif;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:#E8508C;color:#0A1B30}.pb button.g{background:transparent;color:#0A1B30;border:1px solid #C9C3B8}.pb span{font-size:13px;color:#C2306B;font-weight:600}

</style></head><body>
<div class="bar">
<label>Setor / perfil<select id="seg"></select></label>
<label>Empresa(s), uma por linha (até 4)<textarea id="emp"></textarea></label>
<label>Nome(s) na capa<input type="text" id="cap"></label>
<label>Nome na frase final<input type="text" id="fin"></label>
<label class="ck"><input type="checkbox" id="a5" checked>CNPJs com mais de 5 anos</label>
<button onclick="window.print()">Salvar como PDF</button><span class="tip-pdf" style="font-size:12px;color:#9BB5DC;margin-left:6px;align-self:center">💡 <b>Dica PDF:</b> Destino <i>Salvar como PDF</i> · Layout <i>Paisagem</i> · Margens <i>Nenhuma</i></span><button class="g" onclick="nl()">Novo lead</button>
</div>

<div class="pg" id="pg"></div>
<div class="pb"><button onclick="sv()">Salvar como meu setor</button><button class="g" onclick="dl()">Apagar setor salvo</button><span id="msg"></span></div>
</details>
